services:
  aegislure:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${HP_IMAGE:-ghcr.io/zcxads666/aegislure:v0.1.0}
    restart: unless-stopped
    read_only: true
    # The bind-mounted runtime directory is created by the installing user.
    # Keep the container non-root while matching that user for writable state.
    user: "${HP_CONTAINER_UID:-1000}:${HP_CONTAINER_GID:-1000}"
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/usr/local/bin/hpctl", "health", "--config", "/var/lib/aegislure/config.json"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    environment:
      HP_CONFIG: /var/lib/aegislure/config.json
      HP_DATA_DIR: /var/lib/aegislure/data
      HP_DB_DRIVER: ${HP_DB_DRIVER:-sqlite}
      HP_DATABASE_URL: ${HP_DATABASE_URL:-}
      HP_DATABASE_URL_FILE: ${HP_DATABASE_URL_FILE:-}
      HP_DB_HOST: ${HP_DB_HOST:-postgres}
      HP_DB_PORT: ${HP_DB_PORT:-5432}
      HP_DB_NAME: ${HP_DB_NAME:-aegislure}
      HP_DB_USER: ${HP_DB_USER:-aegislure}
      HP_DB_PASSWORD_FILE: ${HP_DB_PASSWORD_FILE:-}
      HP_DB_SSLMODE: ${HP_DB_SSLMODE:-disable}
      HP_GEOIP_PROVIDER: ${HP_GEOIP_PROVIDER:-}
      HP_MAXMIND_CITY_DB: ${HP_MAXMIND_CITY_DB:-/var/lib/aegislure/data/geoip/GeoLite2-City.mmdb}
      HP_MAXMIND_ASN_DB: ${HP_MAXMIND_ASN_DB:-/var/lib/aegislure/data/geoip/GeoLite2-ASN.mmdb}
      HP_IPINFO_LOCATION_DB: ${HP_IPINFO_LOCATION_DB:-/var/lib/aegislure/data/geoip/ipinfo_location.mmdb}
      HP_IPINFO_ASN_DB: ${HP_IPINFO_ASN_DB:-/var/lib/aegislure/data/geoip/ipinfo_asn.mmdb}
      HP_IPINFO_LITE_TOKEN: ${HP_IPINFO_LITE_TOKEN:-}
      HP_IPINFO_LITE_TOKEN_FILE: ${HP_IPINFO_LITE_TOKEN_FILE:-}
      # Docker deployments expose all honeypot protocols by default. Set
      # HP_PROFILES explicitly to run only a selected subset.
      HP_PROFILES: ${HP_PROFILES:-new-api,vllm,ollama,sglang,localai,sub2api}
      HP_ADMIN_PORT: ${HP_ADMIN_PORT:-28443}
      HP_COOKIE_SECURE: "1"
      HP_REQUIRE_TLS: "1"
      # Optional exact Host header allowlist, comma-separated. Keep empty to
      # support a trusted reverse proxy with multiple approved hostnames.
      HP_ADMIN_HOSTS: ${HP_ADMIN_HOSTS:-}
      # Public profile listeners are plain HTTP in this baseline. Set this to
      # 1 only when a trusted HTTPS edge terminates those listeners too.
      HP_PUBLIC_COOKIE_SECURE: "0"
      HP_TLS_CERT: /var/lib/aegislure/secrets/admin.crt
      HP_TLS_KEY: /var/lib/aegislure/secrets/admin.key
    volumes:
      - ${HP_RUNTIME_DIR:-./runtime}:/var/lib/aegislure
      # Bundled PostgreSQL uses an application-owned copy created by the
      # profile-gated secret initializer. External PostgreSQL can continue to
      # use the Compose secret path selected by HP_DB_PASSWORD_FILE.
      - postgres_secrets:/run/aegislure-db-secrets:ro
    ports:
      # Public honeypot and admin listeners are externally reachable by
      # default. Restrict the admin bind address at the host/firewall layer
      # when the management surface must be private.
      # HP_PORT_BIND_IP is legacy; use the two scoped variables instead.
      - target: ${NEW_API_TARGET_PORT:-3000}
        published: "${NEW_API_PORT:-3000}"
        host_ip: "${HP_PUBLIC_PORT_BIND_IP:-0.0.0.0}"
      - target: ${VLLM_TARGET_PORT:-8000}
        published: "${VLLM_PORT:-8000}"
        host_ip: "${HP_PUBLIC_PORT_BIND_IP:-0.0.0.0}"
      - target: ${OLLAMA_TARGET_PORT:-11434}
        published: "${OLLAMA_PORT:-11434}"
        host_ip: "${HP_PUBLIC_PORT_BIND_IP:-0.0.0.0}"
      - target: ${SGLANG_TARGET_PORT:-30000}
        published: "${SGLANG_PORT:-30000}"
        host_ip: "${HP_PUBLIC_PORT_BIND_IP:-0.0.0.0}"
      - target: ${LOCALAI_TARGET_PORT:-8081}
        published: "${LOCALAI_PORT:-8081}"
        host_ip: "${HP_PUBLIC_PORT_BIND_IP:-0.0.0.0}"
      - target: ${SUB2API_TARGET_PORT:-8080}
        published: "${SUB2API_PORT:-8080}"
        host_ip: "${HP_PUBLIC_PORT_BIND_IP:-0.0.0.0}"
      - target: ${HP_ADMIN_PORT:-28443}
        published: "${HP_ADMIN_PORT:-28443}"
        host_ip: "${HP_ADMIN_PORT_BIND_IP:-0.0.0.0}"
    networks:
      # Docker Desktop does not create a host-side port publisher when the
      # container's default network is `internal: true`. Keep the bait and
      # admin networks isolated, but put the published listeners on this
      # dedicated edge bridge. GeoIP API providers such as IPinfo require
      # outbound HTTPS, so only this published edge network has egress.
      - edge_net
      - bait_net
      - admin_net

networks:
  edge_net:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "true"
      com.docker.network.bridge.enable_icc: "false"
  bait_net:
    internal: true
  admin_net:
    internal: true

volumes:
  postgres_secrets:
