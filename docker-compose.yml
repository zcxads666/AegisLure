        host_ip: "${HP_PORT_BIND_IP:-0.0.0.0}"
      - target: 30005
        published: "${SGLANG_PORT_5:-30005}"
        host_ip: "${HP_PORT_BIND_IP:-0.0.0.0}"
      - target: 30006
        published: "${SGLANG_PORT_6:-30006}"
        host_ip: "${HP_PORT_BIND_IP:-0.0.0.0}"
      - target: 30007
