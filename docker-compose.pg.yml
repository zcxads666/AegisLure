services:
  aegislure:
    environment:
      HP_DB_DRIVER: postgres
      HP_DATABASE_URL: ${HP_DATABASE_URL:-}
      HP_DATABASE_URL_FILE: ${HP_DATABASE_URL_FILE:-}
      HP_DB_HOST: ${HP_DB_HOST:-postgres}
      HP_DB_PORT: ${HP_DB_PORT:-5432}
      HP_DB_NAME: ${HP_DB_NAME:-aegislure}
      HP_DB_USER: ${HP_DB_USER:-aegislure}
      # The bundled profile creates this application-owned copy before the
      # app starts. External PostgreSQL installations should override it with
      # their own in-container secret path (the installer does this).
      HP_DB_PASSWORD_FILE: ${HP_DB_PASSWORD_FILE:-/run/aegislure-db-secrets/application_password}
      HP_DB_SSLMODE: ${HP_DB_SSLMODE:-disable}
      HP_PROFILES: ${HP_PROFILES:-new-api,vllm,ollama,sglang,localai,sub2api}
    secrets:
      - aegislure_db_password
    networks:
      - db_net
      - edge_net

  # These one-shot services are intentionally profile-gated. They are the
  # only bundled-PG bootstrap containers that use root: they initialize the
  # data directory and create per-consumer password copies. The long-running
  # database below runs as the image's postgres user. External PostgreSQL
  # users run only `aegislure`; the bundled database is started with
  # `--profile bundled-pg` and is never exposed through a host port.
  postgres-init:
    image: ${HP_POSTGRES_IMAGE:-postgres:16-alpine}
    profiles: [bundled-pg]
    restart: "no"
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        pg_uid="$$(id -u postgres)"
        pg_gid="$$(id -g postgres)"
        mkdir -p /var/lib/postgresql/data
        chown -R "$${pg_uid}:$${pg_gid}" /var/lib/postgresql/data
        chmod 700 /var/lib/postgresql/data
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - db_net
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=8m
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 64m
    cpus: 0.25

  postgres-secret-init:
    image: ${HP_POSTGRES_IMAGE:-postgres:16-alpine}
    profiles: [bundled-pg]
    restart: "no"
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        source_file=/run/secrets/aegislure_db_password
        secret_dir=/var/lib/aegislure-db-secrets
        postgres_file="$${secret_dir}/postgres_password"
        application_file="$${secret_dir}/application_password"
        app_uid="$${AEGISLURE_APP_UID:-1000}"
        app_gid="$${AEGISLURE_APP_GID:-1000}"
        case "$${app_uid}:$${app_gid}" in
          *[!0-9:]*|*:|:*) echo "application UID/GID must be numeric" >&2; exit 1 ;;
        esac
        postgres_uid="$$(id -u postgres)"
        postgres_gid="$$(id -g postgres)"
        test -s "$${source_file}" || { echo "PostgreSQL password source is missing or empty" >&2; exit 1; }
        mkdir -p "$${secret_dir}"
        chmod 711 "$${secret_dir}"
        copy_secret() {
          destination="$1"
          owner="$2"
          if [ -e "$${destination}" ] && [ ! -f "$${destination}" ]; then
            echo "PostgreSQL secret target is not a regular file: $${destination}" >&2
            exit 1
          fi
          if [ ! -s "$${destination}" ]; then
            temporary="$${destination}.tmp.$$$$"
            rm -f "$${temporary}"
            cp "$${source_file}" "$${temporary}"
            chown "$${owner}" "$${temporary}"
            chmod 400 "$${temporary}"
            mv "$${temporary}" "$${destination}"
          else
            chown "$${owner}" "$${destination}"
            chmod 400 "$${destination}"
          fi
        }
        copy_secret "$${postgres_file}" "$${postgres_uid}:$${postgres_gid}"
        # Derive the application copy from the existing PostgreSQL copy so a
        # repeated installer run never rotates a live database password.
        source_file="$${postgres_file}"
        copy_secret "$${application_file}" "$${app_uid}:$${app_gid}"
        chown 0:0 "$${secret_dir}"
        chmod 711 "$${secret_dir}"
    environment:
      AEGISLURE_APP_UID: ${HP_CONTAINER_UID:-1000}
      AEGISLURE_APP_GID: ${HP_CONTAINER_GID:-1000}
    secrets:
      - aegislure_db_password
    volumes:
      - postgres_secrets:/var/lib/aegislure-db-secrets
    networks:
      - db_net
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=8m
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 64m
    cpus: 0.25

  postgres:
    image: ${HP_POSTGRES_IMAGE:-postgres:16-alpine}
    profiles: [bundled-pg]
    restart: unless-stopped
    user: postgres
    depends_on:
      postgres-init:
        condition: service_completed_successfully
      postgres-secret-init:
        condition: service_completed_successfully
    environment:
      POSTGRES_DB: ${HP_DB_NAME:-aegislure}
      POSTGRES_USER: ${HP_DB_USER:-aegislure}
      POSTGRES_PASSWORD_FILE: /run/aegislure-db-secrets/postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - postgres_secrets:/run/aegislure-db-secrets:ro
    networks:
      - db_net
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
      - /run/postgresql:rw,nosuid,nodev,size=8m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

secrets:
  aegislure_db_password:
    file: ${HP_POSTGRES_PASSWORD_FILE:-./runtime/secrets/postgres_password}

volumes:
  postgres_data:
  postgres_secrets:

networks:
  db_net:
    internal: true
  edge_net:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "true"
      com.docker.network.bridge.enable_icc: "false"
