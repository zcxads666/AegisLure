<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Unified AI API gateway and local virtual tenant" />
    <title>New API</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f7f9fc;
        --surface: rgba(255,255,255,.86);
        --surface-solid: #fff;
        --ink: #111827;
        --muted: #667085;
        --subtle: #98a2b3;
        --line: #e7ebf2;
        --line-strong: #d8deea;
        --blue: #3168f5;
        --blue-deep: #1747ca;
        --violet: #7b61ff;
        --cyan: #0ea5c9;
        --green: #14966b;
        --amber: #b86b07;
        --red: #c43d5a;
        --shadow: 0 24px 70px rgba(31, 47, 85, .08);
        --shadow-sm: 0 8px 24px rgba(31, 47, 85, .06);
        --radius-xl: 28px;
        --radius-lg: 20px;
        --radius-md: 14px;
      }
      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body {
        margin: 0;
        min-width: 320px;
        overflow-x: hidden;
        background:
          radial-gradient(circle at 75% 0%, rgba(112, 137, 255, .12), transparent 32rem),
          linear-gradient(180deg, #fbfcff 0, var(--bg) 55%, #f9fafc 100%);
        color: var(--ink);
        font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }
      a { color: inherit; text-decoration: none; }
      button, input, select { font: inherit; }
      button, a { -webkit-tap-highlight-color: transparent; }
      button { cursor: pointer; }
      .site-header {
        position: sticky;
        top: 0;
        z-index: 20;
        border-bottom: 1px solid rgba(231, 235, 242, .78);
        background: rgba(251, 252, 255, .75);
        backdrop-filter: blur(18px);
      }
      .header-inner {
        display: flex;
        align-items: center;
        gap: 28px;
        width: min(1150px, calc(100% - 40px));
        min-height: 64px;
        margin: 0 auto;
      }
      .brand { display: inline-flex; align-items: center; gap: 10px; min-width: max-content; }
      .brand-mark {
        position: relative;
        display: grid;
        place-items: center;
        width: 31px;
        height: 31px;
        overflow: hidden;
        border-radius: 50%;
        color: #fff;
        background: conic-gradient(from 215deg, #39b5e8, #6570f7 38%, #f25cba 72%, #39b5e8);
        box-shadow: 0 6px 14px rgba(65, 91, 239, .25);
      }
      .brand-mark::after { width: 17px; height: 17px; border-radius: 50%; background: var(--bg); content: ""; }
      .brand-mark svg { width: 18px; height: 18px; }
      .brand-name { font-size: 15px; font-weight: 750; letter-spacing: -.02em; }
      .brand-sub { color: var(--subtle); font-size: 11px; font-weight: 600; letter-spacing: .03em; }
      .main-nav { display: flex; align-items: center; gap: 4px; margin-left: auto; }
      .main-nav a, .header-action {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        min-height: 38px;
        padding: 0 12px;
        border-radius: 10px;
        color: #667085;
        font-size: 13px;
        font-weight: 600;
        transition: color .18s ease, background .18s ease;
      }
      .main-nav a:hover, .main-nav a.active { color: var(--ink); background: #edf1fa; }
      .header-tools { display: flex; align-items: center; gap: 8px; }
      .header-theme { display: grid; place-items: center; width: 34px; height: 34px; padding: 0; border: 1px solid var(--line); border-radius: 10px; color: #667085; background: transparent; }
      .header-theme:hover { color: var(--ink); background: rgba(127, 143, 174, .1); }
      .header-menu { display: none; place-items: center; width: 34px; height: 34px; padding: 0; border: 1px solid var(--line); border-radius: 10px; color: #667085; background: transparent; }
      .header-menu:hover { color: var(--ink); background: rgba(127, 143, 174, .1); }
      .header-action { color: #fff; background: var(--ink); padding-inline: 16px; }
      .header-action:hover { background: #263044; }
      .user-chip { color: var(--blue-deep); background: #eaf0ff; max-width: 150px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
      .user-chip:hover { background: #dfe8ff; }
      .main { min-height: calc(100vh - 64px); }
      .container { width: min(1150px, calc(100% - 40px)); margin: 0 auto; }
      .hero {
        position: relative;
        display: grid;
        grid-template-columns: minmax(0, 1.02fr) minmax(390px, .98fr);
        align-items: center;
        gap: 48px;
        padding: 80px 0 74px;
      }
      .hero::before {
        position: absolute;
        z-index: -1;
        top: 18px;
        left: 50%;
        width: 100%;
        height: 620px;
        transform: translateX(-50%);
        background-image: linear-gradient(rgba(74, 109, 195, .055) 1px, transparent 1px), linear-gradient(90deg, rgba(74, 109, 195, .055) 1px, transparent 1px);
        background-size: 42px 42px;
        mask-image: linear-gradient(to bottom, #000, transparent 72%);
        content: "";
        pointer-events: none;
      }
      .eyebrow {
        margin: 0 0 13px;
        color: var(--blue);
        font-size: 11px;
        font-weight: 800;
        letter-spacing: .13em;
        text-transform: uppercase;
      }
      .eyebrow-pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 7px 11px;
        border: 1px solid #dce4ff;
        border-radius: 99px;
        color: #4d5f98;
        background: rgba(242, 245, 255, .86);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: .02em;
      }
      .eyebrow-pill i { display: block; width: 6px; height: 6px; border-radius: 50%; background: #5a7cff; box-shadow: 0 0 0 4px rgba(90,124,255,.12); }
      h1, h2, h3, p { margin-top: 0; }
      .hero h1 {
        max-width: 580px;
        margin: 21px 0 20px;
        font-size: clamp(42px, 4.5vw, 56px);
        line-height: 1.04;
        letter-spacing: -.065em;
      }
      .gradient-text { color: var(--blue); background: linear-gradient(105deg, #2e64eb 0%, #6958ef 70%, #815eea 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
      .hero-copy > p:not(.eyebrow) { max-width: 600px; color: var(--muted); font-size: 16px; line-height: 1.75; }
      .hero-actions { display: flex; flex-wrap: wrap; gap: 11px; margin-top: 29px; }
      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 44px;
        padding: 0 17px;
        border: 1px solid transparent;
        border-radius: 11px;
        font-size: 13px;
        font-weight: 750;
        transition: transform .18s ease, box-shadow .18s ease, background .18s ease, border-color .18s ease;
      }
      .button:hover { transform: translateY(-1px); }
      .button-primary { color: #fff; background: linear-gradient(135deg, #3972f4, #6958e8); box-shadow: 0 9px 20px rgba(63, 91, 230, .2); }
      .button-primary:hover { box-shadow: 0 12px 25px rgba(63, 91, 230, .28); }
      .button-secondary { border-color: var(--line-strong); color: #344054; background: rgba(255,255,255,.8); }
      .button-secondary:hover { border-color: #bfc9dc; background: #fff; }
      .button-quiet { min-height: 36px; padding: 0 12px; color: #5d6c84; background: transparent; }
      .button-danger { border-color: #f3cbd3; color: var(--red); background: #fff7f8; }
      .button:disabled { cursor: not-allowed; opacity: .52; transform: none; }
      .hero-proof { display: flex; flex-wrap: wrap; gap: 18px; margin-top: 30px; color: #8590a4; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
      .hero-proof span { display: inline-flex; align-items: center; gap: 7px; }
      .hero-proof i { width: 6px; height: 6px; border-radius: 50%; background: #62bda1; }
      .terminal {
        min-height: 500px;
        overflow: hidden;
        border: 1px solid #dfe5f0;
        border-radius: var(--radius-xl);
        background: rgba(255,255,255,.84);
        box-shadow: var(--shadow);
      }
      .terminal-top { display: flex; align-items: center; justify-content: space-between; padding: 19px 21px 15px; border-bottom: 1px solid #edf0f6; }
      .terminal-title { display: flex; align-items: center; gap: 9px; font-size: 12px; font-weight: 800; }
      .terminal-title i { width: 8px; height: 8px; border-radius: 50%; background: #2db27d; box-shadow: 0 0 0 4px rgba(45,178,125,.12); }
      .terminal-badge { padding: 5px 8px; border-radius: 7px; color: #5f6d85; background: #f2f5fa; font-size: 10px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
      .terminal-tabs { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; padding: 0 21px; border-bottom: 1px solid #edf0f6; }
      .terminal-tabs button { padding: 14px 12px 11px; border: 0; border-bottom: 2px solid transparent; color: #8a94a7; background: transparent; font-size: 11px; font-weight: 700; }
      .terminal-tabs button.active { border-bottom-color: #ee7800; color: #ee7800; }
      .terminal-status { display: inline-flex; align-items: center; gap: 8px; margin-left: auto; color: #8791a1; font: 10px ui-monospace, SFMono-Regular, Menlo, monospace; }
      .terminal-status i { width: 6px; height: 6px; border-radius: 50%; background: #2db27d; box-shadow: 0 0 0 4px rgba(45,178,125,.1); }
      .terminal-body { padding: 0; }
      .endpoint { display: flex; align-items: center; gap: 10px; margin: 0; padding: 17px 21px; border-bottom: 1px solid #edf0f6; color: #53617a; font: 600 12px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace; }
      .endpoint > span:nth-child(2) { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .method { padding: 5px 7px; border-radius: 6px; color: #157455; background: #e6f7f0; font-size: 10px; font-weight: 800; }
      .ok { margin-left: auto; color: #15956a; font-size: 10px; font-weight: 800; }
      pre { overflow: auto; margin: 0; padding: 17px; border: 1px solid #edf0f5; border-radius: 13px; color: #64718a; background: #fbfcfe; font: 11px/1.75 ui-monospace, SFMono-Regular, Menlo, monospace; }
      .syntax-key { color: #6c57d9; }
      .syntax-string { color: #1a8b77; }
      .syntax-number { color: #bd6a1d; }
      .terminal-panel { padding: 19px 21px; border-bottom: 1px solid #edf0f6; }
      .terminal-label { display: block; margin-bottom: 10px; color: #a0a8b6; font-size: 9px; font-weight: 800; letter-spacing: .16em; }
      .terminal-panel pre { min-height: 136px; border: 0; border-radius: 0; padding: 0; background: transparent; }
      .terminal-response { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin: 0; padding: 14px 21px; border-bottom: 1px solid #edf0f6; background: transparent; color: #63708a; font-size: 11px; }
      .terminal-response strong { color: #273856; font-weight: 750; }
      .terminal-response span:last-child { color: #8290a8; font: 10px ui-monospace, SFMono-Regular, Menlo, monospace; }
      .terminal-footer { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 13px 21px; color: #9ca5b2; font: 9px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .04em; text-transform: uppercase; }
      .section { padding: 70px 0; }
      .section-tight { padding: 26px 0 78px; }
      .section-heading { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin-bottom: 27px; }
      .section-heading h2 { margin: 0; font-size: clamp(25px, 3vw, 37px); line-height: 1.1; letter-spacing: -.045em; }
      .section-heading p { max-width: 500px; margin: 0; color: var(--muted); font-size: 14px; line-height: 1.7; }
      .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
      .stat { padding: 24px; border: 1px solid var(--line); border-radius: var(--radius-lg); background: rgba(255,255,255,.72); }
      .stat strong { display: block; margin-bottom: 5px; color: #273b71; font-size: 31px; letter-spacing: -.05em; }
      .stat span { color: var(--muted); font-size: 12px; font-weight: 650; }
      .feature-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
      .feature-card { min-height: 220px; padding: 23px; border: 1px solid var(--line); border-radius: var(--radius-lg); background: rgba(255,255,255,.73); box-shadow: 0 5px 16px rgba(37,53,84,.025); }
      .feature-card:nth-child(2) { background: linear-gradient(145deg, #f7f4ff, #fff); }
      .feature-card:nth-child(3) { background: linear-gradient(145deg, #f1f8ff, #fff); }
      .feature-card:nth-child(4) { background: linear-gradient(145deg, #effaf8, #fff); }
      .feature-icon { display: grid; place-items: center; width: 34px; height: 34px; margin-bottom: 29px; border-radius: 10px; color: #4d65d8; background: #e9efff; }
      .feature-card:nth-child(2) .feature-icon { color: #785bdd; background: #f0eaff; }
      .feature-card:nth-child(3) .feature-icon { color: #1588a8; background: #e4f7fb; }
      .feature-card:nth-child(4) .feature-icon { color: #168665; background: #e2f7ef; }
      .feature-card h3 { margin-bottom: 8px; font-size: 15px; letter-spacing: -.02em; }
      .feature-card p { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.65; }
      .steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
      .step { padding: 24px; border: 1px solid var(--line); border-radius: var(--radius-lg); background: #fff; }
      .step-number { display: flex; align-items: center; justify-content: space-between; margin-bottom: 34px; color: #68799c; font: 700 11px ui-monospace, SFMono-Regular, Menlo, monospace; }
      .step-number::after { display: block; width: 64px; height: 1px; background: #e1e7f2; content: ""; }
      .step h3 { margin-bottom: 8px; font-size: 15px; }
      .step p { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.7; }
      .callout { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 28px 31px; border: 1px solid #dbe3ff; border-radius: var(--radius-xl); background: linear-gradient(110deg, #f1f4ff, #fbfaff); }
      .callout h2 { margin: 0 0 5px; font-size: 23px; letter-spacing: -.04em; }
      .callout p { margin: 0; color: var(--muted); font-size: 13px; }
      .site-footer { margin-top: 50px; border-top: 1px solid var(--line); background: rgba(255,255,255,.5); }
      .footer-inner { display: flex; align-items: start; justify-content: space-between; gap: 30px; padding: 35px 0 39px; }
      .footer-copy { max-width: 450px; color: var(--muted); font-size: 11px; line-height: 1.7; }
      .footer-copy strong { display: block; margin-bottom: 8px; color: var(--ink); font-size: 13px; }
      .footer-attribution { display: block; margin-top: 6px; color: #7d899c; font-size: 10px; }
      .footer-links { display: flex; flex-wrap: wrap; gap: 14px 22px; color: #68758b; font-size: 11px; font-weight: 650; }
      .footer-links a:hover { color: var(--blue); }
      .boundary-note { display: inline-flex; align-items: center; gap: 6px; margin-top: 13px; padding: 6px 8px; border-radius: 7px; color: #53756c; background: #eaf8f3; font-size: 10px; font-weight: 750; }
      .boundary-note i { width: 6px; height: 6px; border-radius: 50%; background: #2aa77c; }
      .page-intro { padding: 66px 0 31px; }
      .page-intro h1 { margin: 0 0 12px; font-size: clamp(34px, 4.3vw, 54px); letter-spacing: -.06em; line-height: 1.08; }
      .page-intro p { max-width: 680px; margin: 0; color: var(--muted); font-size: 15px; line-height: 1.75; }
      .catalog-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 15px; margin: 20px 0; }
      .catalog-meta { color: var(--muted); font-size: 12px; }
      .model-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
      .model-card { padding: 21px; border: 1px solid var(--line); border-radius: var(--radius-lg); background: #fff; transition: border-color .18s ease, box-shadow .18s ease, transform .18s ease; }
      .model-card:hover { border-color: #cbd6f7; box-shadow: var(--shadow-sm); transform: translateY(-2px); }
      .model-card-head { display: flex; align-items: start; justify-content: space-between; gap: 10px; }
      .model-card h3 { max-width: 230px; margin: 0; overflow: hidden; color: #293750; font: 700 14px/1.35 ui-monospace, SFMono-Regular, Menlo, monospace; text-overflow: ellipsis; white-space: nowrap; }
      .status-dot { display: inline-flex; align-items: center; gap: 5px; color: #218b6c; font-size: 10px; font-weight: 750; white-space: nowrap; }
      .status-dot i { width: 6px; height: 6px; border-radius: 50%; background: #2eb187; }
      .model-card p { min-height: 39px; margin: 20px 0; color: var(--muted); font-size: 12px; line-height: 1.65; }
      .tag-row { display: flex; flex-wrap: wrap; gap: 6px; }
      .tag { padding: 5px 7px; border-radius: 6px; color: #66748c; background: #f2f5fa; font-size: 10px; font-weight: 700; }
      .pricing-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; align-items: stretch; }
      .pricing-card { position: relative; display: flex; flex-direction: column; padding: 27px; border: 1px solid var(--line); border-radius: var(--radius-lg); background: #fff; }
      .pricing-card.featured { border-color: #bccbff; box-shadow: 0 14px 38px rgba(64, 87, 203, .1); }
      .pricing-card.featured::before { position: absolute; top: 0; right: 23px; padding: 5px 8px; border-radius: 0 0 7px 7px; color: #fff; background: #5e67e4; content: "recommended flow"; font-size: 9px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; }
      .pricing-card h2 { margin: 0 0 6px; font-size: 19px; letter-spacing: -.03em; }
      .pricing-label { margin-bottom: 19px; color: #8290a6; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; }
      .pricing-value { margin-bottom: 21px; color: #24355f; font-size: 25px; font-weight: 800; letter-spacing: -.04em; }
      .pricing-value small { color: #8792a6; font-size: 11px; font-weight: 650; letter-spacing: 0; }
      .pricing-list { display: grid; gap: 11px; min-height: 155px; margin: 0 0 22px; padding: 0; list-style: none; color: #667085; font-size: 12px; }
      .pricing-list li { display: flex; align-items: start; gap: 8px; }
      .pricing-list li::before { flex: 0 0 auto; width: 15px; height: 15px; border-radius: 50%; color: #3f76e9; background: #edf2ff; content: "✓"; font-size: 10px; font-weight: 900; line-height: 15px; text-align: center; }
      .pricing-card .button { width: 100%; margin-top: auto; }
      .pricing-disclaimer { margin-top: 17px; color: #8b96a8; font-size: 11px; text-align: center; }
      .docs-grid { display: grid; grid-template-columns: .82fr 1.18fr; gap: 16px; align-items: start; }
      .docs-nav, .docs-panel, .auth-card, .account-card { border: 1px solid var(--line); border-radius: var(--radius-lg); background: #fff; }
      .docs-nav { padding: 10px; }
      .docs-nav a { display: block; padding: 11px 13px; border-radius: 9px; color: #69758a; font-size: 12px; font-weight: 700; }
      .docs-nav a:hover, .docs-nav a.active { color: #2f5bd6; background: #edf2ff; }
      .docs-panel { padding: 26px; }
      .docs-panel h2 { margin-bottom: 10px; font-size: 21px; letter-spacing: -.035em; }
      .docs-panel h3 { margin: 27px 0 10px; font-size: 14px; }
      .docs-panel p, .docs-panel li { color: var(--muted); font-size: 12px; line-height: 1.75; }
      .docs-panel ul { display: grid; gap: 7px; padding-left: 18px; }
      .code-block { overflow: auto; padding: 16px; border-radius: 11px; color: #dbe7ff; background: #18233b; font: 11px/1.8 ui-monospace, SFMono-Regular, Menlo, monospace; }
      .code-block .comment { color: #8797b8; }
      .auth-wrap { display: grid; place-items: center; min-height: calc(100vh - 160px); padding: 50px 0 80px; }
      .auth-layout { display: grid; grid-template-columns: minmax(0, 1fr) 380px; width: min(900px, 100%); gap: 44px; align-items: center; }
      .auth-copy h1 { margin: 0 0 13px; font-size: 42px; letter-spacing: -.06em; line-height: 1.05; }
      .auth-copy > p { max-width: 400px; color: var(--muted); font-size: 14px; line-height: 1.75; }
      .auth-highlights { display: grid; gap: 12px; margin-top: 27px; color: #667085; font-size: 12px; }
      .auth-highlights span { display: flex; align-items: center; gap: 9px; }
      .auth-highlights i { width: 17px; height: 17px; border-radius: 6px; color: #3672de; background: #eaf0ff; font-size: 10px; font-style: normal; line-height: 17px; text-align: center; }
      .auth-card { padding: 27px; box-shadow: var(--shadow-sm); }
      .auth-card h2 { margin: 0 0 6px; font-size: 20px; letter-spacing: -.03em; }
      .auth-switch { margin: 0 0 23px; color: var(--muted); font-size: 12px; }
      .auth-switch a { color: var(--blue); font-weight: 750; }
      .form-grid { display: grid; gap: 14px; }
      .field { display: grid; gap: 6px; }
      .field span { color: #475467; font-size: 11px; font-weight: 750; }
      .field input, .field select { width: 100%; min-height: 42px; padding: 0 12px; border: 1px solid #dce2ec; border-radius: 9px; outline: 0; color: #263650; background: #fbfcfe; font-size: 13px; transition: border-color .18s ease, box-shadow .18s ease; }
      .field select[multiple] { height: 100px; padding: 8px 10px; }
      .field input:focus, .field select:focus { border-color: #87a2fb; box-shadow: 0 0 0 3px rgba(70, 107, 237, .12); }
      .field small { color: #98a2b3; font-size: 10px; line-height: 1.5; }
      .auth-submit { width: 100%; margin-top: 7px; }
      .auth-divider { display: flex; align-items: center; gap: 10px; margin: 21px 0 15px; color: #a0a8b6; font-size: 10px; }

        function docsPage() {
          return publicLayout("docs", pageIntro("Documentation", "A small API surface with a clear contract.", "Use the examples below to exercise the virtual tenant. Keep the generated key local; it is not valid for any other service.") + '<section class="container section-tight"><div class="docs-grid"><nav class="docs-nav"><a class="active" href="#quickstart">Quickstart</a><a href="#auth">Authentication</a><a href="#routes">Compatible routes</a><a href="#boundary">Safety boundary</a></nav><article class="docs-panel"><h2 id="quickstart">Quickstart</h2><p>Register, check in, create a honey key, then send a bounded OpenAI-compatible, Claude Messages, or Gemini GenerateContent request. The response is local and the usage record stays attached to the current honey session.</p><div class="code-block"><span class="comment"># after creating a key in the console</span><br>curl http://localhost:3000/v1/chat/completions \\<br>  -H <span class="syntax-string">"Authorization: Bearer YOUR_HONEY_KEY"</span> \\<br>  -H <span class="syntax-string">"Content-Type: application/json"</span> \\<br>  -d <span class="syntax-string">&quot;{&quot;model&quot;:&quot;honey-model&quot;,&quot;messages&quot;:[{&quot;role&quot;:&quot;user&quot;,&quot;content&quot;:&quot;hello&quot;}]}&quot;</span></div><h3 id="auth">Authentication</h3><p>Only a key created by the current honey tenant is accepted for model calls. Use Authorization Bearer for all surfaces, x-api-key for Claude, or x-goog-api-key for Gemini. The cleartext key is shown once; the database keeps a keyed fingerprint and public prefix metadata, never the raw key.</p><h3 id="routes">Compatible routes</h3><ul><li><code>/v1/models</code> — OpenAI cards; the same path selects Anthropic cards with x-api-key plus anthropic-version.</li><li><code>/v1/messages</code> — Claude Messages with JSON or named SSE events.</li><li><code>/v1/chat/completions</code>, <code>/v1/completions</code>, and <code>/v1/responses</code> — local OpenAI-compatible text surfaces.</li><li><code>/v1/embeddings</code> — bounded deterministic vector shape.</li><li><code>/v1beta/models</code> and <code>/v1beta/models/{model}:generateContent</code> — Gemini catalog and generation; use <code>:streamGenerateContent</code> for SSE.</li><li><code>/v1beta/openai/models</code> — OpenAI-compatible catalog alias.</li></ul><h3 id="boundary">Safety boundary</h3><p>No payment, billing, webhook, real channel, root administration, or upstream LLM relay is exposed in this public tenant. The account pages show virtual quota and local evidence only.</p></article></div></section>');

        }
        function miniLogs() {
          if (!state.accountLoaded) return '<div class="loading"><span class="spinner"></span>Loading usage…</div>';
          if (!state.logs.length) return '<div class="empty"><strong>No calls yet</strong><p>Create a key and make one local request to see its effect.</p></div>';
          return '<div class="mini-list">' + state.logs.slice(0, 4).map((log) => '<div class="mini-row"><span>' + esc(log.model || "virtual model") + '</span><strong>' + esc(log.status || "200") + " · " + fmtDate(log.created_at) + "</strong></div>").join("") + "</div>";
        }
        function keysPage() {
          if (!state.userLoaded) return accountLayout("keys", "API keys", "Loading your scoped credentials…", '<div class="panel"><div class="loading"><span class="spinner"></span>Checking session…</div></div>');
          if (!state.user) return accountLayout("keys", "API keys", "Keys are available only to a signed-in honey tenant.", authGate());
          const modelOptions = state.models.map((model) => '<option value="' + esc(model.id) + '">' + esc(model.id) + "</option>").join("");
          let content = '<article class="panel"><div class="panel-head"><h2>Create a honey key</h2><span>shown once</span></div><div class="panel-body"><div class="key-create"><label class="field"><span>Name</span><input id="new-key-name" maxlength="128" placeholder="local sdk"></label><label class="field"><span>Model allowlist</span><select id="new-key-models" multiple>' + modelOptions + '</select><small>Optional. Hold ⌘/Ctrl to select more than one model.</small></label><button class="button button-primary" data-action="create-key">' + icon("plus", 15) + "Create key</button></div>" + (state.newKey ? '<div class="key-warning"><strong>Copy this key now.</strong> It is returned once and is not stored in the browser.<code id="new-key-value">' + esc(state.newKey) + '</code><button class="button button-secondary" data-action="copy-key">Copy key</button></div>' : "") + "</div></article><article class=\"panel\" style=\"margin-top:14px\"><div class=\"panel-head\"><h2>Your keys</h2><span>" + fmtNumber(state.tokens.length) + " records</span></div>";
          if (!state.accountLoaded) content += '<div class="loading"><span class="spinner"></span>Loading keys…</div>';
          else if (!state.tokens.length) content += '<div class="empty"><strong>No honey keys yet</strong><p>Create a scoped key to start the local invocation flow.</p></div>';
          else content += '<div class="data-table-wrap"><table class="data-table"><thead><tr><th>Name</th><th>Prefix</th><th>Models</th><th>Status</th><th>Last used</th><th></th></tr></thead><tbody>' + state.tokens.map((token) => '<tr><td><strong>' + esc(token.name || "unnamed key") + '</strong></td><td><span class="table-key"><i></i>' + esc(token.prefix_hint || "sk-proj-••••") + "••••</span></td><td>" + (token.model_allowlist && token.model_allowlist.length ? esc(token.model_allowlist.join(", ")) : "all tenant models") + '</td><td>' + (token.disabled_at ? '<span style="color:#bf5268">disabled</span>' : '<span style="color:#238f6e">active</span>') + '</td><td>' + fmtDate(token.last_used_at) + '</td><td><button class="button button-quiet" data-token-action="toggle" data-token-id="' + esc(token.id) + '">' + (token.disabled_at ? "Enable" : "Disable") + '</button><button class="button button-quiet" data-token-action="delete" data-token-id="' + esc(token.id) + '">Delete</button></td></tr>').join("") + "</tbody></table></div>";
          content += "</article>";
          return accountLayout("keys", "API keys", "Create, scope, disable, and delete credentials that are valid only in this local honey tenant.", content);
        }
        function usagePage() {
          if (!state.userLoaded) return accountLayout("usage", "Usage logs", "Loading your local request evidence…", '<div class="panel"><div class="loading"><span class="spinner"></span>Checking session…</div></div>');
          if (!state.user) return accountLayout("usage", "Usage logs", "Logs are scoped to a signed-in honey tenant.", authGate());
          let content = '<article class="panel"><div class="panel-head"><h2>Request history</h2><span>session-scoped · virtual only</span></div>';
          if (!state.accountLoaded) content += '<div class="loading"><span class="spinner"></span>Loading usage logs…</div>';
          else if (!state.logs.length) content += '<div class="empty"><strong>No usage records</strong><p>Accepted local requests will appear here with their request ID and virtual cost.</p></div>';
          else content += '<div class="data-table-wrap"><table class="data-table"><thead><tr><th>Request ID</th><th>Model</th><th>Tokens</th><th>Virtual cost</th><th>Status</th><th>Created</th></tr></thead><tbody>' + state.logs.map((log) => '<tr><td class="mono">' + esc(log.request_id || "—") + '</td><td><strong>' + esc(log.model || "—") + '</strong></td><td>' + fmtNumber(log.total_tokens) + '</td><td>' + fmtNumber(log.cost) + '</td><td style="color:#218b6c">' + esc(log.status || "—") + '</td><td>' + fmtDate(log.created_at) + "</td></tr>").join("") + "</tbody></table></div>";
          content += "</article>";
          return accountLayout("usage", "Usage logs", "Every visible row belongs to this local session and represents virtual compute only.", content);
        }
        function profilePage() {
          if (!state.userLoaded) return accountLayout("profile", "Profile", "Loading your local account summary…", '<div class="panel"><div class="loading"><span class="spinner"></span>Checking session…</div></div>');
          if (!state.user) return accountLayout("profile", "Profile", "Profile details are scoped to a signed-in honey tenant.", authGate());
          const user = state.user;
          const content =
            '<div class="profile-grid">' +
            '<article class="panel"><div class="panel-head"><h2>Account</h2><span>redacted metadata</span></div>' +
            '<div class="panel-body">' +
            '<div class="profile-item"><span>Username hint</span><strong>' + esc(user.username || "—") + '</strong></div>' +
            '<div class="profile-item"><span>Tenant ID</span><strong class="mono">' + esc(user.id || "—") + '</strong></div>' +
            '<div class="profile-item"><span>Virtual balance</span><strong>' + fmtNumber(user.quota) + '</strong></div>' +
            '<div class="profile-item"><span>Check-in</span><strong>' + (user.checked_in ? "complete today" : "available") + '</strong></div>' +
            '</div></article>' +
            '<article class="panel"><div class="panel-head"><h2>Safety boundary</h2><span>fixed policy</span></div>' +
            '<div class="panel-body">' +
            '<div class="profile-item"><span>Raw password</span><strong>never retained</strong></div>' +
            '<div class="profile-item"><span>Raw API key</span><strong>shown once</strong></div>' +
            '<div class="profile-item"><span>Provider relay</span><strong>disabled</strong></div>' +
            '<div class="profile-item"><span>Payment / billing</span><strong>not available</strong></div>' +
            '<div class="profile-item"><span>Public session cookie</span><strong>not used</strong></div>' +
            '</div></article></div>';
          return accountLayout("profile", "Profile", "A privacy-preserving account view for the local virtual tenant.", content);
        }
        function render() {
          const page = pageFromPath();
          let html = "";
          if (page === "home") html = homePageAligned();
          else if (page === "models") html = modelsPage();
          else if (page === "pricing") html = pricingPage();
          else if (page === "docs") html = docsPage();
          else if (page === "login" || page === "register") html = authPage(page);
          else if (page === "forgot") html = forgotPage();
          else if (page === "dashboard") html = dashboardPage();
          else if (page === "keys") html = keysPage();
          else if (page === "usage") html = usagePage();
          else if (page === "profile") html = profilePage();
          root.innerHTML = html;
          document.title = page === "home" ? "New API" : "New API · " + page.charAt(0).toUpperCase() + page.slice(1);
        }
        function refreshSelf() {
          return api("/api/user/self").then((data) => {
            const previousID = state.user && state.user.id;
            state.user = data.data || null;
            if (!state.user || (previousID && previousID !== state.user.id)) state.newKey = "";
            state.userLoaded = true;
          }).catch((error) => {
            if (error.status === 401) {
              state.user = null;
              state.newKey = "";
            }
            state.userLoaded = true;
          });
        }
        function loadModels() {
          if (state.modelsLoading || state.modelsLoaded) return Promise.resolve();
          state.modelsLoading = true;
          return api("/v1/models").then((data) => {
            state.models = Array.isArray(data.data) ? data.data : [];
            state.modelsLoaded = true;
          }).catch(() => {
            state.models = [];
            state.modelsLoaded = true;
            notice("The public model catalog could not be loaded.", "warning");
          }).finally(() => {
            state.modelsLoading = false;
            render();
          });
        }
        function loadAccountData() {
          if (!state.user || state.accountLoading || state.accountLoaded) return Promise.resolve();
          state.accountLoading = true;
          return Promise.all([api("/api/token"), api("/api/log")]).then((results) => {
            state.tokens = Array.isArray(results[0].data) ? results[0].data : [];
            state.logs = Array.isArray(results[1].data) ? results[1].data : [];
            state.accountLoaded = true;
          }).catch((error) => {
            if (error.status === 401) {
              state.user = null;
              state.userLoaded = true;
            } else notice("Some account data could not be loaded.", "warning");
          }).finally(() => {
            state.accountLoading = false;
            render();
          });
        }
        function hydratePage() {
          const page = pageFromPath();
          const jobs = [];
          if (page === "models" || page === "keys") jobs.push(loadModels());
          if (["dashboard", "keys", "usage", "profile"].includes(page) && state.user) jobs.push(loadAccountData());
          return Promise.all(jobs);
        }
        function submitAuth(form) {
          const kind = form.dataset.form;
          const payload = Object.fromEntries(new FormData(form).entries());
          state.authError = "";
          const endpoint = kind === "register" ? "/api/user/register" : (kind === "forgot" ? "/api/user/forgot-password" : "/api/user/login");
          const promise = api(endpoint, { method: "POST", body: JSON.stringify(payload) });
          form.querySelector("button[type=submit]").disabled = true;
          promise.then((data) => {
            if (kind === "forgot") {
              state.authError = "";
              notice((data && data.message) || "If the account exists, recovery instructions are available.", "normal");
              render();
              return null;
            }
            return refreshSelf();
          }).then(() => {
            if (kind === "forgot") return;
            state.accountLoaded = false;
            nav("/dashboard");
          }).catch((error) => {
            state.authError = error.message || "Unable to complete the request.";
            render();
          });
        }
        function doCheckin() {
          api("/api/user/checkin", { method: "POST", body: "{}" }).then((data) => {
            notice(data.already_checked_in ? "Today’s virtual quota was already added." : "1,000 virtual units added to your tenant.", "normal");
            state.accountLoaded = false;
            return refreshSelf();
          }).then(() => loadAccountData()).then(render).catch((error) => notice(error.message || "Check-in unavailable.", "warning"));
        }
        function createKey() {
          const name = document.getElementById("new-key-name");
          const models = document.getElementById("new-key-models");
          const selected = models ? Array.from(models.selectedOptions).map((option) => option.value) : [];
          api("/api/token", { method: "POST", body: JSON.stringify({ name: name ? name.value : "", model_allowlist: selected }) }).then((data) => {
            state.newKey = data.data && data.data.key ? data.data.key : "";
            notice("Honey key created. Copy it now; it will not be shown again.", "warning");
            state.accountLoaded = false;
            return loadAccountData();
          }).then(render).catch((error) => notice(error.message || "Key creation unavailable.", "warning"));
        }
        function tokenAction(action, id) {
          if (!id) return;
          if (action === "delete" && !window.confirm("Delete this honey key?")) return;
          const method = action === "delete" ? "DELETE" : "PATCH";
          const body = action === "delete" ? undefined : JSON.stringify({ disabled: !state.tokens.find((token) => token.id === id).disabled_at });
          api("/api/token/" + encodeURIComponent(id), { method: method, body: body }).then(() => {
            state.accountLoaded = false;
            return loadAccountData();
          }).then(render).catch((error) => notice(error.message || "Key update unavailable.", "warning"));
        }
        function logout() {
          api("/api/user/logout", { method: "POST", body: "{}" }).catch(() => {}).finally(() => {
            state.user = null;
            state.userLoaded = true;
            state.accountLoaded = false;
            state.tokens = [];
            state.logs = [];
            state.newKey = "";
            nav("/");
          });
        }

        root.addEventListener("click", (event) => {
          const terminalButton = event.target.closest("[data-terminal]");
          if (terminalButton) {
            state.terminalTab = terminalButton.dataset.terminal;
            render();
            return;
          }
          const link = event.target.closest("a[data-nav]");
          if (link) {
            event.preventDefault();
            nav(link.getAttribute("href"));
            return;
          }
          const action = event.target.closest("[data-action]");
          if (action) {
            if (action.dataset.action === "theme-toggle") toggleTheme();
            if (action.dataset.action === "menu-toggle") {
              state.menuOpen = !state.menuOpen;
              render();
            }
            if (action.dataset.action === "checkin") doCheckin();
            if (action.dataset.action === "create-key") createKey();
            if (action.dataset.action === "copy-key") {
              const text = state.newKey;
              if (text && navigator.clipboard) navigator.clipboard.writeText(text).then(() => notice("Key copied to clipboard.", "normal")).then(render);
            }
            if (action.dataset.action === "logout") logout();
            return;
          }
          const tokenButton = event.target.closest("[data-token-action]");
          if (tokenButton) tokenAction(tokenButton.dataset.tokenAction, tokenButton.dataset.tokenId);
        });
        root.addEventListener("submit", (event) => {
          const form = event.target.closest("form[data-form]");
          if (!form) return;
          event.preventDefault();
          submitAuth(form);
        });
        window.addEventListener("popstate", () => { state.notice = ""; render(); hydratePage(); });

        applyTheme();
        refreshSelf().then(() => {
          render();
          return hydratePage();
        });
      })();
    </script>
  </body>
</html>
